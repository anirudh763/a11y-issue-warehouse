name: ci

on:
  push:
  pull_request:

# The jobs only read the repository; the token gets no write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (no network)
        run: make test
      - name: Method tests (no network)
        run: python -m pytest -q reproduction/tests
      - name: Build the warehouse from the committed raw pages (no network)
        run: make load
      - name: Data-quality checks on the real data
        run: make check
      - name: Explorer data in docs/ is a fresh export of the warehouse
        run: make site-check
      - name: make serve answers with the page and the data
        run: |
          make serve PORT=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null -w '/ -> %{http_code}\n' http://127.0.0.1:8000/
          curl -fsS -o /dev/null -w '/data/issues.json -> %{http_code}\n' http://127.0.0.1:8000/data/issues.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/data/issues.json)" = 200
          cat serve.log

  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build the warehouse (stdlib only, no network)
        run: make load
      - name: Install Playwright and axe-core
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser test of the explorer (filters, drawer, axe light and dark, 320 px)
        run: make e2e
