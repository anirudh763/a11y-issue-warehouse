name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (no network)
        run: make test
      - name: Build the warehouse from the committed raw pages (no network)
        run: make load
      - name: Data-quality checks on the real data
        run: make check
